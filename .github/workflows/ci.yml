name: CI

# Push runs are limited to the long-lived branches; every other branch is
# covered by its pull request. (Triggering on all pushes AND pull_request ran
# each PR twice.)
on:
  push:
    branches: [main, demo]
  pull_request:

# The workflow only reads the repo. Without this block the job token gets the
# repository's default permissions, which can include write access.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Same Python as the production image (Dockerfile: python:3.11-slim).
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt

      # ruff is much faster than flake8/pylint and covers both linting and
      # import sorting.  --select E,F,W matches the classic pyflakes/pycodestyle
      # subset so warnings don't block CI on style-only issues yet.
      - name: Lint with ruff
        run: ruff check app/ tests/ --select E,F,W

      # DATABASE_URL must be set (even to a dummy value) so the module-level
      # `os.environ["DATABASE_URL"]` in db.py doesn't KeyError at import time.
      # Tests override the DB and stub Redis and every upstream API, so no
      # service containers and no API keys are needed.
      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v

  # Nothing checked the frontend before: a type error or a broken web build
  # went straight to Vercel. There is no frontend lint config or test suite
  # yet, so this is the type check plus the same build Vercel runs.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Expo SDK 57 needs Node 22.13 or newer.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build web export
        run: npx expo export --platform web
